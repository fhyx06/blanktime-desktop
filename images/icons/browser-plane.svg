<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#A896FF"/>
      <stop offset="1" stop-color="#5C49E8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#150A66" flood-opacity=".45"/>
    </filter>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="260" fill="url(#gloss)" clip-path="url(#clip)"/>

  <!-- 星星 -->
  <g fill="#fff" opacity=".85">
    <path d="M84 92l6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/>
    <path d="M436 232l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
    <circle cx="78" cy="268" r="6"/>
    <circle cx="448" cy="170" r="5"/>
  </g>

  <!-- 云朵 -->
  <g>
    <g fill="#BDB3FF" transform="translate(0 7)">
      <circle cx="372" cy="418" r="26"/><circle cx="410" cy="398" r="34"/><circle cx="450" cy="420" r="26"/>
      <rect x="372" y="416" width="104" height="30" rx="15"/>
    </g>
    <g fill="#fff">
      <circle cx="372" cy="418" r="26"/><circle cx="410" cy="398" r="34"/><circle cx="450" cy="420" r="26"/>
      <rect x="372" y="416" width="104" height="30" rx="15"/>
    </g>
    <g fill="#BDB3FF" transform="translate(0 5)">
      <circle cx="118" cy="140" r="18"/><circle cx="144" cy="128" r="24"/><circle cx="172" cy="142" r="18"/>
      <rect x="118" y="140" width="72" height="20" rx="10"/>
    </g>
    <g fill="#fff">
      <circle cx="118" cy="140" r="18"/><circle cx="144" cy="128" r="24"/><circle cx="172" cy="142" r="18"/>
      <rect x="118" y="140" width="72" height="20" rx="10"/>
    </g>
  </g>

  <!-- 绕圈的航迹 -->
  <path d="M60 414C108 430 172 408 178 358C184 312 122 304 118 342C114 378 168 380 204 330"
        fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-dasharray="1 23" opacity=".9"/>

  <!-- 纸飞机本体 -->
  <g filter="url(#sh)" stroke="#32229C" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <path d="M404 108L212 278L260 408Z" fill="#DDD7FF"/>
    <path d="M212 278L260 408L300 324Z" fill="#A99CF7"/>
    <path d="M404 108L104 232L212 278Z" fill="#FFFFFF"/>
  </g>
  <!-- 高光 -->
  <path d="M338 156L252 192" stroke="#E4DFFF" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M322 214L306 258" stroke="#fff" stroke-opacity=".8" stroke-width="10" stroke-linecap="round" fill="none"/>
</svg>
